<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>옥상동물전</title><link rel="stylesheet" href="style.css"></head><body><main>
<section id="lobby" class="card"><h1>옥상동물전 <em>1:1</em></h1><p>실사 동물 턴제 포격전 · 빌라 옥상</p><input id="nick" placeholder="닉네임" maxlength="12"><div class="row"><button id="create">방 만들기</button><input id="code" placeholder="방 코드" maxlength="4"><button id="join">참가</button></div><div id="err"></div></section>
<section id="select" class="card hide"><div class="top"><b>ROOM <span id="roomCode"></span></b><button id="share" type="button">초대 링크 복사</button><span id="wait">상대를 기다리는 중</span></div><h2>캐릭터 선택</h2><div id="roster" class="roster"></div></section>
<section id="game" class="hide"><header><div id="meHud"></div><div class="center"><b id="wind"></b><span id="timer">20</span></div><div id="foeHud"></div></header><div id="turn"></div><div id="notice"></div><div id="arena"><canvas id="cv" width="1000" height="430"></canvas><img id="me" class="unit"><img id="foe" class="unit"><div id="fx"></div></div><div class="controls"><div class="meters"><label>각도 <b id="av">45°</b><input id="angle" type="range" min="10" max="80" value="45"></label><label>파워 <b id="pv">60</b><input id="power" type="range" min="20" max="100" value="60"></label></div><div id="skills" class="skills"></div><div class="row"><button id="left">◀ 이동</button><button id="right">이동 ▶</button><select id="item"><option value="">아이템</option></select><button id="use">사용</button><button id="fire">발사!</button></div></div></section>
<script src="/socket.io/socket.io.js"></script><script src="game.js"></script></main></body></html>
